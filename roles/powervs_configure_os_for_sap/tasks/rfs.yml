---
# Enable Receive Flow Steering (RFS) and ibmveth rx_copybreak

# -------------------------------------------------------------------
# UDEV RULE DISCOVERY
# -------------------------------------------------------------------

- name: Check if any udev rule sets ibmveth rps_flow_cnt
  ansible.builtin.command:
    cmd: grep -rl 'ibmveth.*rps_flow_cnt' /etc/udev/rules.d/ /lib/udev/rules.d/
  register: veth_rfs_grep
  changed_when: false
  failed_when: false

- name: Check if any udev rule sets ibmvnic rps_flow_cnt
  ansible.builtin.command:
    cmd: grep -rl 'ibmvnic.*rps_flow_cnt' /etc/udev/rules.d/ /lib/udev/rules.d/
  register: vnic_rfs_grep
  changed_when: false
  failed_when: false

- name: Check if any udev rule sets rx_copybreak
  ansible.builtin.command:
    cmd: grep -rl 'rx_copybreak' /etc/udev/rules.d/ /lib/udev/rules.d/
  register: rx_copybreak_udev_grep
  changed_when: false
  failed_when: false

- name: Check if any udev rule sets rx_copybreak to 4096
  ansible.builtin.command:
    cmd: grep -rl '4096.*rx_copybreak\|rx_copybreak.*4096' /etc/udev/rules.d/ /lib/udev/rules.d/
  register: rx_copybreak_correct_grep
  changed_when: false
  failed_when: false

# -------------------------------------------------------------------
# IRQ BALANCE CONFIGURATION
# -------------------------------------------------------------------

- name: Gather network facts
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Detect ibmvnic network interfaces
  ansible.builtin.set_fact:
    ibmvnic_interfaces: >-
      {{
        ansible_facts.interfaces
        | difference(['lo'])
        | select('match', '^.*$')
        | map('extract', ansible_facts)
        | selectattr('module', 'defined')
        | selectattr('module', 'equalto', 'ibmvnic')
        | list
      }}

- name: Detect ibmveth network interfaces
  ansible.builtin.set_fact:
    ibmveth_interfaces: >-
      {{
        ansible_facts.interfaces
        | difference(['lo'])
        | select('match', '^.*$')
        | map('extract', ansible_facts)
        | selectattr('module', 'defined')
        | selectattr('module', 'equalto', 'ibmveth')
        | list
      }}

- name: Ensure irqbalance args are present
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/irqbalance
    regexp: ^#?IRQBALANCE_ARGS=.*
    line: |
      IRQBALANCE_ARGS="--banmod=ibmvnic"
    state: present
  register: update_irqbalance
  when: ibmvnic_interfaces | length > 0


- name: Restart irqbalance service
  ansible.builtin.systemd:
    service: irqbalance
    state: restarted
  when:
    - ibmvnic_interfaces | length > 0
    - update_irqbalance.changed


# -------------------------------------------------------------------
# RFS CONFIGURATION
# -------------------------------------------------------------------

- name: Set rps_flow_cnt rule presence facts
  ansible.builtin.set_fact:
    veth_rule_present: "{{ veth_rfs_grep.rc == 0 }}"
    vnic_rule_present: "{{ vnic_rfs_grep.rc == 0 }}"

  ### rps_flow_cnt for veth devices (ibmveth → 32768)
- name: Add udev rule for ibmveth rps_flow_cnt
  ansible.builtin.copy:
    dest: "/etc/udev/rules.d/70-ibmveth-rfs.rules"
    content: |
      SUBSYSTEM=="net",ACTION=="add",DRIVERS=="ibmveth",RUN{program}+="/bin/bash -c 'echo 32768 > /sys/$DEVPATH/queues/rx-0/rps_flow_cnt';"
    owner: root
    group: root
    mode: "0644"
  when: not veth_rule_present
  register: add_veth_rule_result

  # Both vnic rules (rps_flow_cnt=0 AND ethtool channels/ring) are merged
  # into one file so neither write can silently overwrite the other.
  ### rps_flow_cnt for vnic devices (ibmvnic → 0) + channel/ring tuning
# INCREASE RX Queues and set rpx_flow_cnt currently awaiting response from performance team to test this.
#
# - name: Add udev rule for ibmvnic rps_flow_cnt and channel/ring configuration
#   ansible.builtin.copy:
#     dest: "/etc/udev/rules.d/70-ibmvnic-rfs.rules"
#     content: |
#         SUBSYSTEM=="net",ACTION=="add",DRIVERS=="ibmvnic",RUN{program}+="/bin/bash -c '/usr/sbin/ethtool -L $(basename $DEVPATH) rx 16 tx 16 && /usr/sbin/ethtool -G $(basename $DEVPATH) rx 4096 tx 1024 && for q in /sys/$DEVPATH/queues/rx-*/rps_flow_cnt; do echo 0 > $q; done';"
#     owner: root
#     group: root
#     mode: "0644"
#   when:
#     - ibmvnic_interfaces | length > 0
#     - not vnic_rule_present
#   register: add_vnic_rule_result

- name: Add udev rule for ibmvnic rps_flow_cnt and channel/ring configuration
  ansible.builtin.copy:
    dest: "/etc/udev/rules.d/70-ibmvnic-rfs.rules"
    content: |
        SUBSYSTEM=="net",ACTION=="add",DRIVERS=="ibmvnic",RUN{program}+="/bin/bash -c 'for q in /sys/$DEVPATH/queues/rx-*/rps_flow_cnt; do echo 0 > $q; done';"
    owner: root
    group: root
    mode: "0644"
  when:
    - ibmvnic_interfaces | length > 0
    - not vnic_rule_present
  register: add_vnic_rule_result

- name: Reload udev rules
  ansible.builtin.command:
    cmd: udevadm trigger --type=devices --action=add
  when: >-
    (add_veth_rule_result is not skipped and add_veth_rule_result.changed)
    or (add_vnic_rule_result is not skipped and add_vnic_rule_result.changed)

- name: Gather current value of net.core.rps_sock_flow_entries
  ansible.builtin.command:
    cmd: sysctl -n net.core.rps_sock_flow_entries
  register: rps_current_value
  changed_when: false

- name: Ensure net.core.rps_sock_flow_entries is set to 32768
  ansible.posix.sysctl:
    name: net.core.rps_sock_flow_entries
    value: "32768"
    state: present
    reload: true
  when: rps_current_value.stdout != '32768'


# -------------------------------------------------------------------
# RX_COPYBREAK SUPPORT CHECK
# -------------------------------------------------------------------

- name: Check if rx_copybreak parameter exists (ibmveth interfaces only)
  ansible.builtin.stat:
    path: "/sys/class/net/{{ item }}/device/driver/module/parameters/rx_copybreak"
  loop: "{{ ibmveth_interfaces | map(attribute='device') | list }}"
  register: rx_copybreak_check

- name: Determine rx_copybreak support
  ansible.builtin.set_fact:
    rx_copybreak_supported: >-
      {{
        rx_copybreak_check.results
        | selectattr('stat.exists')
        | list
        | length > 0
      }}

# -------------------------------------------------------------------
# RX_COPYBREAK RUNTIME (CURRENT SESSION)
# -------------------------------------------------------------------

- name: Read current rx_copybreak runtime value
  ansible.builtin.command: cat /sys/module/ibmveth/parameters/rx_copybreak
  register: rx_copybreak_current
  changed_when: false
  failed_when: false
  when: rx_copybreak_supported

- name: Set rx_copybreak runtime value to 4096 for ibmveth
  ansible.builtin.command: tee /sys/module/ibmveth/parameters/rx_copybreak
  args:
    stdin: "4096"
  when:
    - rx_copybreak_supported
    - rx_copybreak_current.stdout | trim != '4096'
  become: yes

# -------------------------------------------------------------------
# RX_COPYBREAK PERSISTENCE (NEXT BOOT)
# -------------------------------------------------------------------

- name: Read kernel command line
  ansible.builtin.command: cat /proc/cmdline
  register: kernel_cmdline
  changed_when: false
  when: rx_copybreak_supported

- name: Detect any ibmveth.rx_copybreak in kernel cmdline
  ansible.builtin.set_fact:
    rx_kernel_present: "{{ 'ibmveth.rx_copybreak=' in kernel_cmdline.stdout }}"
    rx_kernel_correct: "{{ 'ibmveth.rx_copybreak=4096' in kernel_cmdline.stdout }}"
  when: rx_copybreak_supported

- name: Set rx_copybreak udev rule state facts
  ansible.builtin.set_fact:
      rx_rule_present: "{{ rx_copybreak_udev_grep.rc == 0 }}"
      rx_rule_correct: "{{ rx_copybreak_correct_grep.rc == 0 }}"
  when: rx_copybreak_supported

# ---------------- Kernel update ----------------

  # Remove any grubby arg when:
  #   - a udev rule owns persistence (right or wrong value — udev path takes over), OR
  #   - the grubby arg has the wrong value (will be re-added correctly below)

# RHEL: use grubby
- name: Remove ibmveth.rx_copybreak kernel arg (RHEL)
  ansible.builtin.command: >
    grubby --update-kernel=ALL --remove-args="ibmveth.rx_copybreak"
  when:
    - rx_copybreak_supported
    - rx_kernel_present
    - rx_rule_present or not rx_kernel_correct
    - ansible_distribution is match("RedHat*")

# SLES: edit /etc/default/grub directly
- name: Remove ibmveth.rx_copybreak kernel arg (SLES)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '\s*ibmveth\.rx_copybreak=\S+'
    replace: ''
  register: sles_grub_remove
  when:
    - rx_copybreak_supported
    - rx_kernel_present
    - rx_rule_present or not rx_kernel_correct
    - ansible_distribution is match("SLES*")

# RHEL: use grubby
- name: Add ibmveth.rx_copybreak=4096 kernel arg (RHEL)
  ansible.builtin.command: >
    grubby --update-kernel=ALL --args="ibmveth.rx_copybreak=4096"
  when:
    - rx_copybreak_supported
    - not rx_rule_present
    - ansible_distribution is match("RedHat*")

# SLES: edit /etc/default/grub directly
- name: Add ibmveth.rx_copybreak=4096 kernel arg (SLES)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    backrefs: true
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?:(?!ibmveth\.rx_copybreak)[^"])*)"'
    line: '\1 ibmveth.rx_copybreak=4096"'
  register: sles_grub_add
  when:
    - rx_copybreak_supported
    - not rx_rule_present
    - ansible_distribution is match("SLES*")

- name: Rebuild grub config (SLES)
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  when:
    - ansible_distribution is match("SLES*")
    - (sles_grub_remove is not skipped and sles_grub_remove.changed)
      or (sles_grub_add is not skipped and sles_grub_add.changed)

# ---------------- Udev update ----------------

  # Write (or overwrite) the udev rule when:
  #   - the file is absent entirely, OR
  #   - the file exists but has the wrong value
  # Skip entirely when grubby already owns persistence (kernel arg is present and correct)
- name: Enforce rx_copybreak udev rule with correct value
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-ibmveth-rx.rules
    content: |
      SUBSYSTEM=="net", ACTION=="add", DRIVERS=="ibmveth", \
      RUN{program}+="/bin/bash -c 'echo 4096 > /sys/module/ibmveth/parameters/rx_copybreak'"
    owner: root
    group: root
    mode: "0644"
  when:
    - rx_copybreak_supported
    - not rx_kernel_correct
    - not rx_rule_correct
